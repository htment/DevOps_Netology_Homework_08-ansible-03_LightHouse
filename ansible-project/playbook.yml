---
- name: Install Clickhouse
  hosts: clickhouse
  gather_facts: false
  tags:
    - clickhouse
    - install
  
  handlers:
#    - name: Start clickhouse service
#      become: true
#      ansible.builtin.shell: |
#        /usr/bin/clickhouse-server --config=/etc/clickhouse-server/config.xml --daemon
#      when: ansible_system == "Linux"
    - name: Start ClickHouse server inside container
      command: >
        docker exec clickhouse-server
        /usr/bin/clickhouse-server
        --config=/etc/clickhouse-server/config.xml
        --daemon
      register: clickhouse_start
      failed_when: clickhouse_start.rc != 0 and "already running" not in clickhouse_start.stderr



  tasks:
    - name: Get clickhouse distrib___________
      ansible.builtin.get_url:
        url: "https://packages.clickhouse.com/rpm/stable/{{ item }}-{{ clickhouse_version }}.x86_64.rpm"
        dest: "/tmp/{{ item }}-{{ clickhouse_version }}.rpm"
      loop: "{{ clickhouse_packages }}"
      tags:
        - download

    - name: Create supervisor config for clickhouse
      become: true
      ansible.builtin.template:
        src: clickhouse-supervisor.conf.j2
        dest: /etc/supervisor/conf.d/clickhouse.conf
      notify: Start clickhouse service

    - name: Reread supervisor config
      become: true
      ansible.builtin.command: supervisorctl reread
      changed_when: false

    - name: Update supervisor
      become: true
      ansible.builtin.command: supervisorctl update
      changed_when: false
      
    - name: Install clickhouse packages
      become: true
      ansible.builtin.yum:
        name:
          - "/tmp/clickhouse-client-{{ clickhouse_version }}.rpm"
          - "/tmp/clickhouse-server-{{ clickhouse_version }}.rpm"
          - "/tmp/clickhouse-common-static-{{ clickhouse_version }}.rpm"
        state: present
        disable_gpg_check: true
      notify: Start clickhouse service
      tags:
        - install

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Create database
      ansible.builtin.command: "clickhouse-client -q 'create database logs;'"
      register: create_db
      failed_when: create_db.rc != 0 and create_db.rc !=82
      changed_when: create_db.rc == 0
      tags:
        - configure

- name: Install Vector
  hosts: vector
  gather_facts: false
  tags:
    - vector
    - install

  tasks:
    - name: Install Vector
      become: true
      ansible.builtin.shell: |
        curl -O https://repositories.timber.io/public/vector/cfg/setup/bash.deb.sh
        bash bash.deb.sh
        rm bash.deb.sh
        apt-get install -y vector
      args:
        creates: /usr/bin/vector
      tags:
        - install

    - name: Configure Vector
      become: true
      ansible.builtin.template:
        src: vector.toml.j2
        dest: "{{ vector_config_path }}"
        mode: 0644
      notify: Restart vector
      tags:
        - configure

    - name: Start Vector service
      become: true
      ansible.builtin.service:
        name: vector
        state: started
        enabled: true
      tags:
        - configure

  handlers:
    - name: Restart vector
      become: true
      ansible.builtin.service:
        name: vector
        state: restarted

- name: Install Lighthouse
  hosts: lighthouse
  gather_facts: false
  tags:
    - lighthouse
    - install

  tasks:
    - name: Install git and nginx
      become: true
      ansible.builtin.apt:
        name:
          - git
          - nginx
        state: present
        update_cache: true
      tags:
        - install

    - name: Clone Lighthouse repository
      ansible.builtin.git:
        repo: "{{ lighthouse_repo }}"
        dest: "{{ lighthouse_path }}"
        version: "{{ lighthouse_version }}"
        force: true
      tags:
        - download

    - name: Configure Nginx for Lighthouse
      become: true
      ansible.builtin.template:
        src: nginx_lighthouse.conf.j2
        dest: "{{ nginx_config_path }}"
        mode: 0644
      notify: Restart nginx
      tags:
        - configure

    - name: Remove default nginx config
      become: true
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Restart nginx
      tags:
        - configure

    - name: Start Nginx service
      become: true
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
      tags:
        - configure

  handlers:
    - name: Restart nginx
      become: true
      ansible.builtin.service:
        name: nginx
        state: restarted
