---
- name: Download Vector RPM
  ansible.builtin.get_url:
    url: "https://packages.timber.io/vector/{{ vector_version }}/vector-{{ vector_version }}-1.x86_64.rpm"
    dest: "/tmp/vector-{{ vector_version }}.rpm"
    mode: '0644'
  delegate_to: localhost

- name: Copy RPM to container
  ansible.builtin.copy:
    src: "/tmp/vector-{{ vector_version }}.rpm"
    dest: "/tmp/vector.rpm"
    mode: '0644'

- name: Install Vector
  ansible.builtin.command:
    cmd: rpm -ivh /tmp/vector.rpm
  register: vector_install
  failed_when: vector_install.rc != 0 and vector_install.rc != 1

- name: Create Vector config
  ansible.builtin.copy:
    dest: /etc/vector/vector.toml
    content: |
      [sources.dummy]
      type = "demo_logs"
      format = "apache_common"
      interval = 1

      [api]
      enabled = true
      address = "0.0.0.0:8696"
      playground = true

      [sources.http]
      type = "http_server"
      address = "0.0.0.0:8686"

      [sinks.stdout]
      type = "console"
      inputs = ["dummy", "http"]
      encoding.codec = "json"
    mode: '0644'

- name: Replace vector service file with correct config
  ansible.builtin.copy:
    dest: /usr/lib/systemd/system/vector.service
    content: |
      [Unit]
      Description=Vector
      Documentation=https://vector.dev
      After=network-online.target
      Requires=network-online.target

      [Service]
      User=vector
      Group=vector
      ExecStartPre=/usr/bin/vector validate /etc/vector/vector.toml
      ExecStart=/usr/bin/vector --config /etc/vector/vector.toml
      ExecReload=/usr/bin/vector validate /etc/vector/vector.toml
      ExecReload=/bin/kill -HUP $MAINPID
      Restart=always
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      EnvironmentFile=-/etc/default/vector
      StartLimitInterval=10
      StartLimitBurst=5

      [Install]
      WantedBy=multi-user.target
    mode: '0644'
    backup: yes
  notify: Restart vector

- name: Enable and start Vector
  ansible.builtin.systemd:
    name: vector
    enabled: yes
    state: started
    daemon_reload: yes

- name: Check Vector status
  ansible.builtin.command: systemctl status vector
  register: vector_status
  changed_when: false
  ignore_errors: yes

- name: Show Vector status
  ansible.builtin.debug:
    var: vector_status.stdout_lines
  when: vector_status is defined