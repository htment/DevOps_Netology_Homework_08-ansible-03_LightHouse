
- name: Download ClickHouse packages to localhost
  ansible.builtin.get_url:
    url: "https://packages.clickhouse.com/rpm/stable/{{ item }}"
    dest: "/tmp/{{ item }}"
    timeout: 10
    mode: "0644"
    force: no
  delegate_to: localhost
  loop:
    - "clickhouse-common-static-{{ clickhouse_version }}.x86_64.rpm"
    - "clickhouse-server-{{ clickhouse_version }}.x86_64.rpm"
    - "clickhouse-client-{{ clickhouse_version }}.x86_64.rpm"
  run_once: true

- name: Copy packages to container
  ansible.builtin.copy:
    src: "/tmp/{{ item }}"
    dest: "/tmp/{{ item }}"
    mode: '0644'
  loop:
    - "clickhouse-common-static-{{ clickhouse_version }}.x86_64.rpm"
    - "clickhouse-server-{{ clickhouse_version }}.x86_64.rpm"
    - "clickhouse-client-{{ clickhouse_version }}.x86_64.rpm"

- name: Install ClickHouse packages
  ansible.builtin.shell:
    cmd: |
      rpm -ivh /tmp/clickhouse-common-static-{{ clickhouse_version }}.x86_64.rpm
      rpm -ivh /tmp/clickhouse-server-{{ clickhouse_version }}.x86_64.rpm
      rpm -ivh /tmp/clickhouse-client-{{ clickhouse_version }}.x86_64.rpm
  register: rpm_install
  failed_when: rpm_install.rc != 0 and rpm_install.rc != 1
  changed_when: "'already installed' not in rpm_install.stderr"

- name: Create ClickHouse directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /var/lib/clickhouse
    - /var/log/clickhouse-server
    - /var/run/clickhouse-server

- name: Configure ClickHouse to listen on all interfaces
  ansible.builtin.shell:
    cmd: |
      sed -i 's/<!-- <listen_host>0.0.0.0<\/listen_host> -->/<listen_host>0.0.0.0<\/listen_host>/' /etc/clickhouse-server/config.xml
      sed -i '/<listen_host>::1<\/listen_host>/d' /etc/clickhouse-server/config.xml
      sed -i '/<listen_host>127.0.0.1<\/listen_host>/d' /etc/clickhouse-server/config.xml
  register: config_update
  changed_when: config_update.rc == 0

- name: Check if ClickHouse is already running
  ansible.builtin.command: pgrep -f clickhouse
  register: clickhouse_running
  changed_when: false
  failed_when: false
  ignore_errors: yes

- name: Stop ClickHouse server if running
  ansible.builtin.command: pkill -f clickhouse
  when: clickhouse_running.rc == 0
  ignore_errors: yes

- name: Start ClickHouse server
  ansible.builtin.command:
    cmd: /usr/bin/clickhouse-server --daemon --config-file=/etc/clickhouse-server/config.xml
  register: clickhouse_start
  failed_when: clickhouse_start.rc != 0

- name: Wait for ClickHouse port
  ansible.builtin.wait_for:
    port: 9000
    delay: 5
    timeout: 30
  register: port_check

- name: Verify ClickHouse is running
  ansible.builtin.command: pgrep -f clickhouse
  register: clickhouse_process
  changed_when: false

- name: Create logs database
  ansible.builtin.command:
    cmd: clickhouse-client -q "CREATE DATABASE IF NOT EXISTS logs"
  when: port_check is success
  register: db_create
  failed_when: db_create.rc != 0 and "already exists" not in db_create.stderr

- name: Show installation summary
  ansible.builtin.debug:
    msg:
      - "ClickHouse installation completed"
      - "Process ID: {{ clickhouse_process.stdout }}"
      - "Database 'logs' created: {{ db_create is success }}"